<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette Generator — Web Tools</title>
  <link rel="stylesheet" href="../../assets/css/shared.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-title" href="../../index.html">Web Tools &amp; Learning Artifacts</a>
      <nav class="site-nav">
        <a href="../../index.html">&larr; Back to tools</a>
      </nav>
    </div>
  </header>

  <main>
    <h1>🎨 Color Palette Generator</h1>
    <p>Pick a base color and a scheme to generate a palette. Click any swatch to copy its hex code.</p>

    <div class="tool-panel">
      <div class="scheme-controls">
        <div class="field">
          <label for="base-color">Base color</label>
          <div class="color-input-row">
            <input type="color" id="base-color" value="#3b5bdb">
            <input type="text" id="base-color-text" value="#3B5BDB" maxlength="7">
          </div>
        </div>

        <div class="field">
          <label for="scheme-select">Scheme</label>
          <select id="scheme-select">
            <option value="complementary">Complementary</option>
            <option value="analogous">Analogous</option>
            <option value="monochromatic">Monochromatic</option>
          </select>
        </div>
      </div>

      <div id="status" class="status-message" role="status"></div>

      <div class="palette" id="palette"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
